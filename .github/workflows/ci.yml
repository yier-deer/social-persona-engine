name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  java-build:
    name: Java (Maven + Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-manager

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test and package
        run: mvn verify -B --no-transfer-progress

  python-check:
    name: Python (离线回归 + 语法检查)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check (py_compile all .py files)
        run: python -m compileall -q engine/ api/ 2>/dev/null || python -m compileall engine/ api/

      - name: Verify critical imports
        run: |
          python -c "import fastapi; import uvicorn; import openai; import pydantic; print('Core OK')"
          python -c "import sentence_transformers; print('Embedding OK')"

      - name: Offline regression tests
        run: python -m pytest -q

  frontend-build:
    name: Frontend (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  windows-lifecycle:
    name: Windows (服务生命周期回归)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lifecycle safety tests
        shell: pwsh
        run: ./scripts/test-lifecycle.ps1
